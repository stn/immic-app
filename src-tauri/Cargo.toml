[package]
name = "immic-app"
version = "0.3.6"
description = "Immic App"
authors = ["Akira Ishino"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-save", "dialog-open", "window-hide", "global-shortcut-all", "notification-all", "window-create", "process-command-api", "process-exit", "system-tray", "shell-open"] }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

active-win-pos-rs = "0.8.3"
actix-cors = "0.7.0"
actix-web = "4.5.1"
anyhow = "1.0.80"
chrono = "0.4"
dotenv = "0.15.0"
env_logger = "0.11.3"
futures = "0.3.30"
image = "0.25.1"
log = "0.4.21"
notify-debouncer-full = { version = "0.3.1", default-features = false }
once_cell = "1.19"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7.4", features = ["runtime-tokio",  "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.10"
xcap = "0.0.8"
unicode-segmentation = "1.11.0"
url = "2.5.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
